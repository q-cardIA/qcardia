[project]
name = "qcardia"
version = "0.0.1"
requires-python = ">=3.10,<3.13"  # torch 2.3.1 has wheels up to Python 3.12
dependencies = [
    "scipy==1.12.0",
    "scikit-image==0.22.0",
    "opencv-python==4.10.0.84",
    "requests>=2.31.0",
    "qcardia-models@git+https://github.com/q-cardIA/qcardia-models",
    "qcardia-data@git+https://github.com/q-cardIA/qcardia-data"
]

[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"
