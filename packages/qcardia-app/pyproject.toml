[project]
name = "qcardia-app"
version = "1.0.0"
description = "Desktop viewer for cardiac MR studies: hanging protocols, cine, LGE, perfusion and flow, segmentation contours and results."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Cian Scannell", email = "c.m.scannell@tue.nl"},
    {name = "Marcus Vroemen", email = "m.j.vroemen@tue.nl"},
]
requires-python = ">=3.11"
keywords = ["cardiac MRI", "DICOM viewer", "medical image analysis", "deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26.3",
    "pydicom>=2.4.4",
    "pyside6>=6.6.2",
    "pyyaml>=6.0.1",
    "qcardia>=0.2,<1",
    "scipy>=1.11.4",
    "torch>=2.3",
    "wandb>=0.30.0",
]

[project.scripts]
qcardia-app = "qcardia_app.main:main"

[project.urls]
Homepage = "https://github.com/q-cardIA/qcardia"
Repository = "https://github.com/q-cardIA/qcardia"
Issues = "https://github.com/q-cardIA/qcardia/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcardia_app"]
