[project]
name = "qcardia"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "scipy==1.12.0",
    "scikit-image==0.22.0",
    "opencv-python==4.10.0.84",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    # Open dependencies only: the public qcardia-models and qcardia-data packages
    # on this repo's main branch. They have no ContextUNet2d and no LA-SAx
    # intersection geometry, so context-aware and LA-conditioned inference raise
    # an ImportError. Plain-UNet inference works.
    "qcardia-models@git+https://github.com/q-cardIA/qcardia@main#subdirectory=packages/qcardia-models",
    "qcardia-data@git+https://github.com/q-cardIA/qcardia@main#subdirectory=packages/qcardia-data"
]

[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"
